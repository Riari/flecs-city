on: [push]

jobs:
    runs-on: ubuntu-latest

    test:
        steps:
            - name: checkout
              uses: actions/checkout@v6
            - name: vcpkg bootstrap
              run: ./vcpkg/bootstrap-vcpkg.sh
            - name: vcpkg install
              run: ./vcpkg/vcpkg install
            - name: test
              run: zig build test

